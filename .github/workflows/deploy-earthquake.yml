name: Deploy Earthquake Connect to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Local Verification Test
        run: |
          if [ -f "test-local.mjs" ]; then
            node test-local.mjs
          fi

      - name: Export Static Site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=earthquake-connect --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Health Endpoint Contract
        run: |
          response="$(curl -fsS https://earthquake-connect.pages.dev/api/health)"
          node -e 'const body = JSON.parse(process.argv[1]); const expected = { ok: true, service: "earthquake-connect", mode: "observation-only", officialWarning: false, version: "4.0", frontend: "cloudflare-pages", dataPlane: "separate" }; const keys = Object.keys(body).sort(); const expectedKeys = Object.keys(expected).sort(); if (JSON.stringify(keys) !== JSON.stringify(expectedKeys)) process.exit(1); for (const [k, v] of Object.entries(expected)) { if (body[k] !== v) process.exit(1); }' "$response"
